[project]
name = "hass-renson-smartliving"
version = "0.1.0"
description = "Home Assistant integration for Renson Smart Living (OpenMotics) gateways"
requires-python = ">=3.14"
license = "MIT"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-homeassistant-custom-component>=0.13",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = [
    "B",      # flake8-bugbear
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "N",      # pep8-naming
    "S",      # flake8-bandit
    "UP",     # pyupgrade
    "W",      # pycodestyle warnings
]
ignore = [
    "S101",   # assert used in tests
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.renson_smartliving"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
