set_thermostat_schedule:
  name: Set thermostat schedule
  description: >-
    Replace the heating schedule of an OpenMotics thermostat for one,
    several or all days. Setpoints are HH:MM times with a target
    temperature; the gateway applies the schedule value from that time
    until the next one.
  target:
    entity:
      integration: renson_smartliving
      domain: climate
  fields:
    days:
      name: Days
      description: "Days to update (default: all days). Ignored when week is set."
      example: ["mon", "tue"]
      required: false
      selector:
        object:
    setpoints:
      name: Setpoints
      description: "List of {time: HH:MM, temperature: x} entries (or use week)."
      required: false
      selector:
        object:
    week:
      name: Week
      description: >-
        Full week as day-keyed setpoint lists; days not listed keep
        their schedule. Used to copy a week between thermostats.
      required: false
      selector:
        object:

set_thermostat_config:
  name: Set thermostat config
  description: >-
    Set the away temperature and the lead time (early heating, minutes
    before a schedule setpoint) of an OpenMotics thermostat.
  target:
    entity:
      integration: renson_smartliving
      domain: climate
  fields:
    away_temperature:
      name: Away temperature
      description: Away heating setpoint in degrees Celsius.
      required: false
      selector:
        number:
          min: 6
          max: 32
          step: 0.5
    lead_time:
      name: Lead time
      description: Early heating in minutes before a schedule setpoint.
      required: false
      selector:
        number:
          min: 0
          max: 360
          step: 1

set_thermostat_override:
  name: Set thermostat override
  description: >-
    Apply a setpoint override with an explicit expiration: hours from
    now, a wall-clock until time or permanent. Without an expiration
    the configured default (preset_expiration_hours) applies.
  target:
    entity:
      integration: renson_smartliving
      domain: climate
  fields:
    temperature:
      name: Temperature
      description: Target setpoint in degrees Celsius.
      required: true
      selector:
        number:
          min: 6
          max: 32
          step: 0.5
    hours:
      name: Hours
      description: Override expires this many hours from now.
      required: false
      selector:
        number:
          min: 0.5
          max: 48
          step: 0.5
    until:
      name: Until
      description: Override expires at this wall-clock time (gateway timezone).
      required: false
      selector:
        time:
    permanent:
      name: Permanent
      description: Keep the override until it is changed manually.
      required: false
      default: false
      selector:
        boolean:
